# Dependabot keeps npm + github-actions deps current. Weekly cadence,
# minor/patch npm updates grouped so transitive bumps don't fan out into many
# small PRs; npm majors stay individual since they can break production.
#
# GITHUB ACTIONS SÃO AGRUPADAS INCLUINDO MAJOR, de propósito, e a razão é que o
# risco é de outra natureza: action de CI é infraestrutura de teste, e o próprio
# CI é o teste dela — se um major quebrar, o workflow reprova no PR e ninguém
# chega em produção. Já um major de npm passa no CI e quebra depois.
#
# Sem grupo, cada action vira um PR individual; major nunca cai em grupo nenhum,
# e eles ENVELHECEM. O diff de um PR de Actions é do estado do repositório
# quando ele foi ABERTO: em 30/08/2026 o bcb#8 cobriu publish.yml e calou sobre
# seis ocorrências que surgiram depois, deixando o CI com v4 e v7 misturados.
# Um PR agrupado por semana cobre sempre o repositório inteiro e é sempre fresco.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # BIBLIOTECA: o range declarado é o PISO que os consumidores precisam, não
    # a versão que o CI usa. Na estratégia padrão o Dependabot subiu o peer do
    # mcp-search de ^2.0.0 a ^2.1.0 junto com a devDependency (#24, 29/09/2026),
    # e a 0.8.0 publicada não instalava no senado (o `agents` fixa a SDK 2.0.0).
    # `increase-if-necessary` só mexe no range quando a versão nova não cabe nele.
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "npm"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
