# Dependabot keeps npm deps current. Weekly cadence, minor/patch grouped so
# transitive bumps don't fan out into many small PRs; majors stay individual
# since they can break production.
#
# NÃO HÁ bloco de github-actions aqui: este repositório não tem
# .github/workflows/. O Dependabot reprova o job inteiro quando o bloco existe
# sem workflow para vigiar — "dependency_file_not_found: /action.yml or
# /.github/workflows/<anything>.yml not found", medido em 30/08/2026. Ao dar CI
# a este repositório, acrescentar o bloco agrupado dos irmãos.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "npm"
