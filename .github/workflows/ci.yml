name: CI

# Este repositório passou a ter CI em 30/08/2026. Até então NADA rodava em push:
# os 188 testes das cinco workspaces só existiam para quem lembrasse de chamá-los
# à mão. É a peça de maior alcance do portfólio — os três `@sbissoli/*` são
# consumidos pelos seis servidores MCP —, então uma regressão aqui sai em release
# e chega em bcb, ibge e senado ao mesmo tempo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Matriz, ao contrário dos servidores que fixam uma versão: isto é
      # BIBLIOTECA. Quem consome roda em 20 e em 22, então é nas duas que
      # precisa compilar e passar — não na que o autor tem instalada.
      fail-fast: false
      matrix:
        # Piso é node >= 22 (engines do package). O 20 saiu em 31/08/2026: fim
        # de vida em 30/04/2026, sem correção de segurança desde então.
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` e não `npm install`: é a instalação estrita, a única que recusa
      # conflito de peer em vez de resolvê-lo em silêncio. Um lockfile que só
      # funciona com install passa despercebido em tudo que vem depois, porque
      # typecheck, teste e build rodam sobre a árvore já acomodada.
      - run: npm ci

      # BUILD PRIMEIRO, e a ordem não é gosto. O template cloudflare-worker
      # importa `@sbissoli/mcp-provenance` pelo nome público, e o que resolve
      # esse nome é o `dist/` do pacote irmão. Em clone limpo o dist ainda não
      # existe, então typechecar antes de compilar falha com TS2307 — foi o que
      # derrubou a primeira execução deste workflow, em 30/08/2026. Na máquina
      # do autor passava, porque lá sempre havia dist de uma rodada anterior:
      # o defeito era do repositório, não do CI, e só um checkout limpo o mostra.
      - run: npm run build

      # Os três comandos abrem `--workspaces --if-present`, então cobrem os
      # pacotes publicados E os templates. Os templates entram de propósito:
      # são semente de servidor novo, e semente quebrada só aparece no dia em que
      # alguém a usa.
      - run: npm run typecheck
      - run: npm test

      # O que vai ao npm é `dist/`, alcançado pelo `exports` de cada pacote — e
      # nada acima prova que esse caminho resolve. Build verde com `files` ou
      # `exports` errado publica um pacote que não importa, e o erro só aparece
      # no consumidor. Roda DEPOIS do build, pelo nome público (as workspaces
      # estão ligadas em node_modules/@sbissoli), que é exatamente como os seis
      # servidores importam.
      - name: entrypoints publicados carregam e exportam
        run: |
          node --input-type=module -e '
          // A lista é derivada de packages/*: pacote novo entra sozinho e não
          // fica de fora da verificação por esquecimento (foi assim que o
          // mcp-search quase ficou de fora, em 02/09/2026).
          import { readdirSync, readFileSync } from "node:fs";
          const pacotes = readdirSync("packages").map(
            (dir) => JSON.parse(readFileSync(`packages/${dir}/package.json`, "utf8")).name,
          );
          for (const nome of pacotes) {
            const m = await import(nome);
            const exportados = Object.keys(m).filter((k) => k !== "default");
            if (exportados.length === 0) throw new Error(`${nome} carrega mas não exporta nada`);
            console.log(`${nome}: ${exportados.length} exports`);
          }
          '
